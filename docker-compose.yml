services:
  app:
    build: ./docker/php
    container_name: mayanh-app
    ports:
      - "8006:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mayanh-db
    ports:
      - "33066:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sql_mayanh_webch
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mayanh-db-data:/var/lib/mysql
      # Mount dung file dump cua mayanh, khong mount ca thu muc.
      - ./sql_mayanh_webch.sql:/docker-entrypoint-initdb.d/01-mayanh.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 60

  phpmyadmin:
    image: phpmyadmin:5
    container_name: mayanh-pma
    ports:
      - "8086:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 256M
    depends_on:
      - db

volumes:
  mayanh-db-data:
